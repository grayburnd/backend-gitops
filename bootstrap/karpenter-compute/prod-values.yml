team: backend
subnet:
  ids: ["subnet-09fa4a0a8f233a923", "subnet-09fa4a0a8f233a924"] ##Change
securityGroup:
  ids: ["sg-063d7acfb4b06c82c", "sg-063d7acfb4b06c82b"] ##Change
iamRoleName:
  node: NodeIAMRole ##Change
ami:
  aliasName: bottlerocket
  pinnedVersion: v1.64.0
imdsV2Required: true #bool
detailedMonitoring: false
associatePublicIPAddress: false
instanceRequirements:
  categories: ["t", "m"]
  families: [] #["t4g","m6g","m5a","m5","t3"] ommit to let generations be flexible on the Instance Types
  cpus: ["2", "4"]
  generations: ["3"]
  zones: ["us-east-1a", "us-east-1b"]
  capacity_types: ["spot"] #["spot", "on-demand", "reserved"]
disruption:
  consolidationPolicy: Balanced # WhenEmptyOrUnderutilized | Balanced | WhenEmpty
  consolidateAfter: 10m #1m | Never
  percentageNodeDisruption: 20
limits:
  cpu: 8 ##Number of vCPU's
  memory: 16 ##Auto appends Gi on the end