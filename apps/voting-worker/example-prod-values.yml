team: backend
environment: prod
labels:
  app: voting
  component: worker
  env: prod
  team: backend
replicas: "1"
aws:
  accountId: "123456789123"
  region: us-east-1
securityContext:
  runAsGroup: 999 #appgroup
  runAsNonRoot: true
  runAsUser: 999 #appuser
  fsGroup: 999
image:
  name: voting-worker
  tag: 05a91b42f6271e56d5a12c0539e90e2310adaa91
ports: []
envFrom: #[]
  - configMapRef:
      name: postgres-connection
  - configMapRef:
      name: redis-connection
env: #[]
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-secret
        key: password
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-admin.postgres.credentials
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-admin.postgres.credentials
        key: password
scaling:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50
resources:
  requests:
    cpu: "0.25"
    memory: "0.35Gi"
pdb:
  minAvailable: 1
