team: backend
environment: prod
labels:
  app: voting
  component: worker
  env: prod
  team: backend
replicas: "1"
aws:
  accountId: "632988741882"
  region: us-east-1
image:
  name: worker
  tag: v0.2.0
ports: []
envFrom: #[]
  - configMapRef:
      name: postgres-connection
  - configMapRef:
      name: redis-connection
env: #[]
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-secret
        key: password
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: db-admin.postgres.credentials
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db-admin.postgres.credentials
        key: password
  